# Render Blueprint: in the Render dashboard choose New > Blueprint and pick this repo.
services:
  - type: web
    name: adaptify-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # The free plan has no persistent disk, so the SQLite database is rebuilt
    # with sample data every time the service starts.
    startCommand: python manage.py migrate && python manage.py seed_demo --clear && gunicorn adaptify.wsgi --bind 0.0.0.0:$PORT --log-file -
    healthCheckPath: /api/text/
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.21
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://adaptify-frontend.vercel.app
