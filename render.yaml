# Render Blueprint: in the Render dashboard choose New > Blueprint and pick this repo.
services:
  - type: web
    name: adaptify-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Sample data is added only when the database is empty. Without DATABASE_URL
    # the app uses SQLite on Render's temporary disk, which is empty on every start.
    startCommand: python manage.py migrate && python manage.py seed_demo --if-empty && gunicorn adaptify.wsgi --bind 0.0.0.0:$PORT --log-file -
    healthCheckPath: /api/text/
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.21
      - key: SECRET_KEY
        generateValue: true
      # Postgres connection string for persistent data; set it in the Render dashboard.
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://adaptify-frontend.vercel.app
